# --------------------------------------------------------------------------- #
#    Documentation of AStarSearch                                             #
#                                                                             #
#    Builds the documentation and publishes it on the pages of the            #
#    repository at each push to main: the site of MkDocs Material, whose      #
#    pages docs/pages.py writes from the README, the design note and the      #
#    CHANGELOG, and under /api/ the reference of Doxygen with the theme       #
#    doxygen-awesome-css.                                                     #
#                                                                             #
#                                Donato Meoli                                 #
#                         Dipartimento di Informatica                         #
#                             Universita' di Pisa                             #
# --------------------------------------------------------------------------- #
name: Docs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: the site of MkDocs Material
        run: |
          pip install 'mkdocs>=1.6,<2' 'mkdocs-material>=9.5,<10'
          python3 docs/pages.py
          mkdocs build --strict -d build-docs/site
      - name: the API reference of Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz
          git clone --depth 1 --branch v2.3.4 \
              https://github.com/jothepro/doxygen-awesome-css build-docs/awesome
          doxygen Doxyfile
          cp -R build-docs/api build-docs/site/api
          touch build-docs/site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build-docs/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
